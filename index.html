<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>அம்மா மிட்டோ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        h1 {
            margin: 0;
            padding: 20px 16px;
            width: 100%;
            text-align: center;
            font-size: clamp(24px, 4vw, 42px);
            font-weight: 600;
            line-height: 1.4;
        }

        .image-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

<h1>
    அம்மா மிட்டோ - ஓம் சக்தி முத்துலட்சுமி அம்மன் துணை
</h1>

<div class="image-container">
    <img src="Ammamitto.jpg" alt="அம்மா மிட்டோ">
</div>

</body>
</html>
